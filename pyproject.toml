[project]
name = "job-posting-radar"
version = "0.1.0"
description = "Job Postings Radar ingestion and processing pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.3.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "qdrant-client>=1.12.0,<1.16.0",
  "sentence-transformers>=3.1.0",
  "torch>=2.4.0",
  "numpy>=1.26.0",
  "prometheus-client>=0.20.0",
  "kedro>=0.19.0",
  "kedro-viz>=6.7.0",
  "kedro-datasets[pandas]>=9.1.1",
]

[project.optional-dependencies]
dev = [
  "black>=24.8.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["job_posting_radar*"]

[tool.kedro]
package_name = "job_posting_radar"
project_name = "job-posting-radar"
kedro_init_version = "1.1.1"
source_dir = "src"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
src = ["app", "scripts"]
target-version = "py311"
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app"]



[tool.kedro_telemetry]
project_id = "5c2664fa34474222b759d5f017b93909"
